<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Calendar - 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Zoom Level Slider */
        .zoom-slider {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 15px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .zoom-levels {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .zoom-level {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.4;
        }

        .zoom-level.active {
            opacity: 1;
        }

        .zoom-level:hover {
            opacity: 0.7;
        }

        .zoom-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #667eea;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .zoom-level.active .zoom-dot {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .zoom-label {
            font-size: 11px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }

        /* Mode Toggle (Bottom Left) */
        .mode-toggle {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 6px;
            border-radius: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            z-index: 100;
        }

        .mode-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* Main Calendar */
        .calendar-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 1200px;
        }

        #zoomGroup {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }

        /* Segments */
        .segment {
            cursor: pointer;
            transition: opacity 0.3s ease, fill 0.3s ease;
            stroke: white;
            stroke-width: 2;
        }

        .segment:hover:not(.faded) {
            opacity: 0.8;
        }

        .segment.faded {
            opacity: 0.3;
            cursor: default;
        }

        .segment.context {
            opacity: 0.5;
        }

        /* Labels */
        .label {
            font-size: 14px;
            font-weight: 600;
            fill: white;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.3s ease;
        }

        .label.faded {
            opacity: 0.3;
        }

        .week-label {
            font-size: 11px;
            font-weight: 600;
            fill: white;
            pointer-events: none;
            user-select: none;
        }

        .day-label {
            font-size: 9px;
            font-weight: 600;
            fill: white;
            pointer-events: none;
            user-select: none;
        }

        .month-name {
            font-size: 16px;
            font-weight: 700;
            fill: white;
            pointer-events: none;
            user-select: none;
        }

        .center-label {
            font-size: 48px;
            font-weight: 700;
            fill: #333;
            pointer-events: none;
            user-select: none;
        }

        /* Colors */
        .q1-color { fill: #FF6B6B; }
        .q2-color { fill: #4ECDC4; }
        .q3-color { fill: #45B7D1; }
        .q4-color { fill: #FFA07A; }

        .t1-color { fill: #FF6B6B; }
        .t2-color { fill: #4ECDC4; }
        .t3-color { fill: #FFA07A; }

        .month-1 { fill: #FF6B6B; }
        .month-2 { fill: #FF5252; }
        .month-3 { fill: #FF3838; }
        .month-4 { fill: #4ECDC4; }
        .month-5 { fill: #3DB9B0; }
        .month-6 { fill: #2DA59C; }
        .month-7 { fill: #45B7D1; }
        .month-8 { fill: #34A3BD; }
        .month-9 { fill: #2390A9; }
        .month-10 { fill: #FFA07A; }
        .month-11 { fill: #FF8C66; }
        .month-12 { fill: #FF7852; }

        /* Title */
        .title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 2em;
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 50;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 class="title" id="title">RADIAL CALENDAR 2026</h1>

        <!-- Zoom Level Slider -->
        <div class="zoom-slider">
            <div class="zoom-levels">
                <div class="zoom-level active" data-level="0">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Year</span>
                </div>
                <div class="zoom-level" data-level="1">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label" id="groupLabel">Quarter</span>
                </div>
                <div class="zoom-level" data-level="2">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Month</span>
                </div>
                <div class="zoom-level" data-level="3">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Week</span>
                </div>
                <div class="zoom-level" data-level="4">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Day</span>
                </div>
            </div>
        </div>

        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <button class="mode-btn active" id="quarterBtn">Quarter</button>
            <button class="mode-btn" id="trimesterBtn">Trimester</button>
        </div>

        <!-- Calendar SVG -->
        <div class="calendar-container">
            <svg id="calendar" viewBox="0 0 1000 1000">
                <g id="zoomGroup">
                    <!-- Content will be dynamically generated -->
                </g>
            </svg>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const YEAR = 2026;
        const CENTER_X = 500;
        const CENTER_Y = 500;
        const BASE_RADIUS = 400;

        // ===== STATE =====
        let viewMode = 'quarter'; // 'quarter' or 'trimester'
        let zoomLevel = 0; // 0=year, 1=quarter/trimester, 2=month, 3=week, 4=day
        let focusPath = []; // e.g., [0] for Q1, [0, 1] for Q1->February, [0, 1, 2] for Q1->Feb->Week3

        // ===== DATA =====
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                          'July', 'August', 'September', 'October', 'November', 'December'];
        const monthAbbrev = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        const quarters = {
            q1: { label: 'Q1', months: [0, 1, 2], color: 'q1-color', startAngle: 0 },
            q2: { label: 'Q2', months: [3, 4, 5], color: 'q2-color', startAngle: 90 },
            q3: { label: 'Q3', months: [6, 7, 8], color: 'q3-color', startAngle: 180 },
            q4: { label: 'Q4', months: [9, 10, 11], color: 'q4-color', startAngle: 270 }
        };

        const trimesters = {
            t1: { label: 'T1', months: [0, 1, 2, 3], color: 't1-color', startAngle: 0 },
            t2: { label: 'T2', months: [4, 5, 6, 7], color: 't2-color', startAngle: 120 },
            t3: { label: 'T3', months: [8, 9, 10, 11], color: 't3-color', startAngle: 240 }
        };

        function getCurrentGroups() {
            return viewMode === 'quarter' ? quarters : trimesters;
        }

        function getGroupForMonth(monthIndex) {
            const groups = getCurrentGroups();
            for (const [key, group] of Object.entries(groups)) {
                if (group.months.includes(monthIndex)) {
                    return key;
                }
            }
            return null;
        }

        function getWeeksForMonth(monthIndex) {
            const weeks = [];
            let weekNum = 1;
            for (let i = 0; i < monthIndex; i++) {
                weekNum += Math.ceil(monthDays[i] / 7);
            }
            const numWeeks = Math.ceil(monthDays[monthIndex] / 7);
            for (let i = 0; i < numWeeks; i++) {
                weeks.push(weekNum + i);
            }
            return weeks;
        }

        // ===== SVG HELPERS =====
        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        function describeArc(x, y, radius, startAngle, endAngle) {
            const start = polarToCartesian(x, y, radius, endAngle);
            const end = polarToCartesian(x, y, radius, startAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return `M ${x} ${y} L ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
        }

        function getLabelPosition(centerX, centerY, radius, startAngle, endAngle) {
            const midAngle = (startAngle + endAngle) / 2;
            return polarToCartesian(centerX, centerY, radius, midAngle);
        }

        // ===== RENDERING =====
        function renderCalendar() {
            const container = document.getElementById('zoomGroup');
            let html = '';

            // Always render full year structure
            // Level 0: Year view shows months
            // Level 1+: Shows more detail based on zoom

            if (zoomLevel === 0) {
                // Year view: show all 12 months
                html += renderYearView();
            } else if (zoomLevel === 1) {
                // Group view: show months with weeks
                html += renderGroupView();
            } else if (zoomLevel === 2) {
                // Month view: show weeks with days
                html += renderMonthView();
            } else if (zoomLevel === 3) {
                // Week view: show days
                html += renderWeekView();
            } else if (zoomLevel === 4) {
                // Day view: show hours/details
                html += renderDayView();
            }

            container.innerHTML = html;
            attachEventHandlers();
            applyZoomTransform();
        }

        function renderYearView() {
            let html = '';
            const degreesPerMonth = 30;

            monthNames.forEach((monthName, index) => {
                const startAngle = index * degreesPerMonth;
                const endAngle = (index + 1) * degreesPerMonth;
                const groupKey = getGroupForMonth(index);
                const group = getCurrentGroups()[groupKey];
                const color = group.color;

                const path = describeArc(CENTER_X, CENTER_Y, BASE_RADIUS, startAngle, endAngle);
                const labelPos = getLabelPosition(CENTER_X, CENTER_Y, BASE_RADIUS * 0.75, startAngle, endAngle);

                html += `<path class="segment ${color}" data-type="month" data-index="${index}" d="${path}" />`;
                html += `<text class="label" x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle">${monthAbbrev[index]}</text>`;
            });

            // Center circle
            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="100" fill="white" stroke="#333" stroke-width="2"/>`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y + 15}" text-anchor="middle">${YEAR}</text>`;

            return html;
        }

        function renderGroupView() {
            let html = '';
            const groups = getCurrentGroups();
            const groupKey = Object.keys(groups)[focusPath[0]];
            const group = groups[groupKey];

            const numMonths = group.months.length;
            const totalAngle = viewMode === 'quarter' ? 90 : 120;
            const degreesPerMonth = totalAngle / numMonths;
            const startAngle = group.startAngle;

            // Render all months in the year for context
            const degreesPerMonthYear = 30;
            monthNames.forEach((monthName, index) => {
                const mStartAngle = index * degreesPerMonthYear;
                const mEndAngle = (index + 1) * degreesPerMonthYear;
                const mGroupKey = getGroupForMonth(index);
                const mGroup = getCurrentGroups()[mGroupKey];
                const isInFocus = group.months.includes(index);

                const path = describeArc(CENTER_X, CENTER_Y, BASE_RADIUS, mStartAngle, mEndAngle);
                const classes = `segment ${mGroup.color} ${!isInFocus ? 'context' : ''}`;

                html += `<path class="${classes}" data-type="month-bg" d="${path}" />`;
            });

            // Render focused group with week details
            group.months.forEach((monthIndex, idx) => {
                const monthStart = startAngle + (idx * degreesPerMonth);
                const monthEnd = monthStart + degreesPerMonth;
                const weeks = getWeeksForMonth(monthIndex);
                const degreesPerWeek = degreesPerMonth / weeks.length;

                weeks.forEach((weekNum, weekIdx) => {
                    const weekStart = monthStart + (weekIdx * degreesPerWeek);
                    const weekEnd = weekStart + degreesPerWeek;

                    const path = describeArc(CENTER_X, CENTER_Y, BASE_RADIUS, weekStart, weekEnd);
                    const labelPos = getLabelPosition(CENTER_X, CENTER_Y, BASE_RADIUS * 0.65, weekStart, weekEnd);

                    html += `<path class="segment month-${monthIndex + 1}" data-type="week" data-month="${monthIndex}" data-week="${weekNum}" d="${path}" />`;
                    html += `<text class="week-label" x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle">${weekNum}</text>`;
                });

                const monthLabelPos = getLabelPosition(CENTER_X, CENTER_Y, BASE_RADIUS * 0.85, monthStart, monthEnd);
                html += `<text class="month-name" x="${monthLabelPos.x}" y="${monthLabelPos.y}" text-anchor="middle">${monthNames[monthIndex]}</text>`;
            });

            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="80" fill="white" stroke="#333" stroke-width="2"/>`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y + 5}" text-anchor="middle">${group.label}</text>`;
            html += `<text class="label" style="font-size: 18px; fill: #666;" x="${CENTER_X}" y="${CENTER_Y + 30}" text-anchor="middle">${YEAR}</text>`;

            return html;
        }

        function renderMonthView() {
            let html = '';
            // TODO: Implement month view with weeks and days
            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="100" fill="white" />`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y}" text-anchor="middle">Month</text>`;
            return html;
        }

        function renderWeekView() {
            let html = '';
            // TODO: Implement week view
            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="100" fill="white" />`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y}" text-anchor="middle">Week</text>`;
            return html;
        }

        function renderDayView() {
            let html = '';
            // TODO: Implement day view
            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="100" fill="white" />`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y}" text-anchor="middle">Day</text>`;
            return html;
        }

        function attachEventHandlers() {
            if (zoomLevel === 0) {
                // Year view: click month to zoom to group
                document.querySelectorAll('[data-type="month"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const monthIndex = parseInt(e.target.dataset.index);
                        const groupKey = getGroupForMonth(monthIndex);
                        const groups = getCurrentGroups();
                        const groupIndex = Object.keys(groups).indexOf(groupKey);
                        zoomTo(1, [groupIndex]);
                    });
                });
            } else if (zoomLevel === 1) {
                // Group view: click week to zoom to month
                document.querySelectorAll('[data-type="week"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const monthIndex = parseInt(e.target.dataset.month);
                        zoomTo(2, [focusPath[0], monthIndex]);
                    });
                });
            }
        }

        function applyZoomTransform() {
            const zoomGroup = document.getElementById('zoomGroup');

            if (zoomLevel === 0) {
                // No zoom, no rotation
                zoomGroup.style.transform = 'rotate(0deg) scale(1)';
            } else if (zoomLevel === 1) {
                // Zoom to quarter/trimester
                const groups = getCurrentGroups();
                const groupKey = Object.keys(groups)[focusPath[0]];
                const group = groups[groupKey];

                // Calculate mid angle of the segment
                const totalAngle = viewMode === 'quarter' ? 90 : 120;
                const midAngle = group.startAngle + (totalAngle / 2);

                // Rotate to center segment at 12 o'clock (0 degrees)
                const rotation = -midAngle;

                // Scale to zoom in
                const scale = viewMode === 'quarter' ? 3.5 : 2.8;

                zoomGroup.style.transform = `rotate(${rotation}deg) scale(${scale})`;
            } else if (zoomLevel === 2) {
                // Zoom to month
                const groups = getCurrentGroups();
                const groupKey = Object.keys(groups)[focusPath[0]];
                const group = groups[groupKey];
                const monthIndex = focusPath[1];

                // Calculate the month's position within the group
                const numMonths = group.months.length;
                const totalAngle = viewMode === 'quarter' ? 90 : 120;
                const degreesPerMonth = totalAngle / numMonths;
                const monthIndexInGroup = group.months.indexOf(monthIndex);
                const monthStartAngle = group.startAngle + (monthIndexInGroup * degreesPerMonth);
                const monthMidAngle = monthStartAngle + (degreesPerMonth / 2);

                // Rotate to center month at 12 o'clock
                const rotation = -monthMidAngle;

                // Scale to zoom in on month
                const scale = 8;

                zoomGroup.style.transform = `rotate(${rotation}deg) scale(${scale})`;
            } else if (zoomLevel === 3) {
                // Zoom to week (placeholder)
                const scale = 15;
                zoomGroup.style.transform = `rotate(0deg) scale(${scale})`;
            } else if (zoomLevel === 4) {
                // Zoom to day (placeholder)
                const scale = 30;
                zoomGroup.style.transform = `rotate(0deg) scale(${scale})`;
            }
        }

        function zoomTo(level, path) {
            console.log(`Zooming to level ${level}, path:`, path);
            zoomLevel = level;
            focusPath = path;
            updateUI();
            renderCalendar();
        }

        function updateUI() {
            // Update zoom slider
            document.querySelectorAll('.zoom-level').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.level) === zoomLevel);
            });

            // Update title
            if (zoomLevel === 0) {
                document.getElementById('title').textContent = 'RADIAL CALENDAR 2026';
            } else if (zoomLevel === 1) {
                const groups = getCurrentGroups();
                const groupKey = Object.keys(groups)[focusPath[0]];
                document.getElementById('title').textContent = `${groups[groupKey].label} 2026`;
            }
        }

        function switchMode(mode) {
            if (viewMode === mode) return;
            viewMode = mode;

            document.getElementById('quarterBtn').classList.toggle('active', mode === 'quarter');
            document.getElementById('trimesterBtn').classList.toggle('active', mode === 'trimester');
            document.getElementById('groupLabel').textContent = mode === 'quarter' ? 'Quarter' : 'Trimester';

            // Reset to year view when switching modes
            zoomTo(0, []);
        }

        // Get current date segments for smart navigation
        function getCurrentDateSegments() {
            const now = new Date();
            const month = now.getMonth(); // 0-11 (0 = January)
            const dayOfMonth = now.getDate(); // 1-31

            // Find which group (quarter/trimester) this month belongs to
            const groupKey = getGroupForMonth(month);
            const groups = getCurrentGroups();
            const groupIndex = Object.keys(groups).indexOf(groupKey);

            // Calculate day of year
            let dayOfYear = 0;
            for (let i = 0; i < month; i++) {
                dayOfYear += monthDays[i];
            }
            dayOfYear += dayOfMonth;

            // Calculate week number (simplified - week 1 starts Jan 1)
            const weekNum = Math.ceil(dayOfYear / 7);

            return {
                groupIndex,     // 0-3 for quarters, 0-2 for trimesters
                month,          // 0-11
                weekNum,        // 1-52
                dayOfMonth,     // 1-31
                dayOfYear       // 1-365
            };
        }

        // Event listeners
        document.getElementById('quarterBtn').addEventListener('click', () => switchMode('quarter'));
        document.getElementById('trimesterBtn').addEventListener('click', () => switchMode('trimester'));

        document.querySelectorAll('.zoom-level').forEach(el => {
            el.addEventListener('click', () => {
                const targetLevel = parseInt(el.dataset.level);

                if (targetLevel < zoomLevel) {
                    // Zoom out
                    zoomTo(targetLevel, focusPath.slice(0, targetLevel));
                } else if (targetLevel > zoomLevel) {
                    // Zoom in - use current date to determine path
                    const current = getCurrentDateSegments();

                    if (targetLevel === 1) {
                        // Zoom to current quarter/trimester
                        zoomTo(1, [current.groupIndex]);
                    } else if (targetLevel === 2) {
                        // Zoom to current month
                        zoomTo(2, [current.groupIndex, current.month]);
                    } else if (targetLevel === 3) {
                        // Zoom to current week
                        zoomTo(3, [current.groupIndex, current.month, current.weekNum]);
                    } else if (targetLevel === 4) {
                        // Zoom to current day
                        zoomTo(4, [current.groupIndex, current.month, current.weekNum, current.dayOfMonth]);
                    }
                }
            });
        });

        // Initialize
        renderCalendar();
        console.log('Radial Calendar 2026 initialized');
        console.log('Click segments to zoom in, use slider to zoom out');
    </script>
</body>
</html>
