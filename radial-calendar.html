<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Calendar - 2026</title>
    <style>
        :root {
            /* Light Mode (Default) */
            --bg-primary: #e0e0e0;
            --bg-secondary: #f5f5f5;
            --segment-default: #ffffff;
            --segment-border: #dddddd;
            --text-primary: #333333;
            --text-secondary: #666666;
            --current-date-outline: #000000;
            --ui-bg: rgba(255, 255, 255, 0.95);
            --ui-shadow: rgba(0, 0, 0, 0.2);
            --thin-line: #cccccc;
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --segment-default: #3a3a3a;
            --segment-border: #555555;
            --text-primary: #e0e0e0;
            --text-secondary: #999999;
            --current-date-outline: #ffffff;
            --ui-bg: rgba(60, 60, 60, 0.95);
            --ui-shadow: rgba(0, 0, 0, 0.5);
            --thin-line: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Zoom Level Slider */
        .zoom-slider {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--ui-bg);
            padding: 20px 15px;
            border-radius: 30px;
            box-shadow: 0 8px 32px var(--ui-shadow);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .zoom-levels {
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
        }

        .zoom-level {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.4;
        }

        .zoom-level.active {
            opacity: 1;
        }

        .zoom-level:hover {
            opacity: 0.7;
        }

        .zoom-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-secondary);
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .zoom-level.active .zoom-dot {
            width: 24px;
            height: 24px;
            background: var(--text-primary);
            box-shadow: 0 4px 12px var(--ui-shadow);
        }

        .zoom-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
        }

        /* Settings Gear Icon */
        .settings-trigger {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--ui-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px var(--ui-shadow);
            z-index: 100;
            transition: all 0.3s ease;
        }

        .settings-trigger:hover {
            transform: rotate(90deg);
        }

        .settings-trigger svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        /* Settings Panel */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100vh;
            background: var(--ui-bg);
            box-shadow: -4px 0 32px var(--ui-shadow);
            z-index: 99;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 30px;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        .settings-group {
            margin-bottom: 30px;
        }

        .settings-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: block;
        }

        .toggle-container {
            background: var(--bg-secondary);
            padding: 4px;
            border-radius: 25px;
            display: inline-flex;
            gap: 4px;
        }

        .toggle-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .toggle-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        /* Hour Range Slider */
        .hour-range-container {
            position: relative;
            padding: 20px 0;
        }

        .hour-range-track {
            position: relative;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            margin: 10px 0;
        }

        .hour-range-selected {
            position: absolute;
            height: 100%;
            background: var(--text-primary);
            border-radius: 3px;
        }

        .hour-range-input {
            position: absolute;
            width: 100%;
            height: 6px;
            background: transparent;
            pointer-events: none;
            -webkit-appearance: none;
            margin: 0;
        }

        .hour-range-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            pointer-events: all;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 2px 6px var(--ui-shadow);
        }

        .hour-range-input::-moz-range-thumb {
            pointer-events: all;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px var(--ui-shadow);
        }

        .hour-range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .hour-range-values {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Main Calendar */
        .calendar-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
        }

        svg {
            width: 100vw;
            height: 100vh;
            overflow: visible;
        }

        #zoomGroup {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }

        /* Segments */
        .segment {
            cursor: pointer;
            transition: opacity 0.3s ease, fill 0.3s ease, stroke 0.3s ease;
            fill: var(--segment-default);
            stroke: var(--segment-border);
            stroke-width: 1.5;
        }

        .segment:hover:not(.faded):not(.non-clickable) {
            opacity: 0.8;
        }

        .segment.faded {
            opacity: 0.3;
            cursor: default;
        }

        .segment.context {
            opacity: 0.5;
        }

        .segment.current-date {
            stroke: var(--current-date-outline);
            stroke-width: 3;
        }

        .segment.non-clickable {
            cursor: default;
        }

        /* Thin lines for sub-divisions */
        .thin-line {
            stroke: var(--thin-line);
            stroke-width: 0.5;
            fill: none;
            pointer-events: none;
        }

        /* Labels */
        .label {
            font-size: 14px;
            font-weight: 600;
            fill: var(--text-primary);
            pointer-events: none;
            user-select: none;
            transition: opacity 0.3s ease, fill 0.3s ease;
        }

        .label.faded {
            opacity: 0.3;
        }

        .week-label {
            font-size: 11px;
            font-weight: 600;
            fill: var(--text-primary);
            pointer-events: none;
            user-select: none;
        }

        .day-label {
            font-size: 9px;
            font-weight: 600;
            fill: var(--text-primary);
            pointer-events: none;
            user-select: none;
        }

        .hour-label {
            font-size: 8px;
            font-weight: 600;
            fill: var(--text-primary);
            pointer-events: none;
            user-select: none;
        }

        .month-name {
            font-size: 16px;
            font-weight: 700;
            fill: var(--text-primary);
            pointer-events: none;
            user-select: none;
        }

        .center-label {
            font-size: 48px;
            font-weight: 700;
            fill: var(--text-primary);
            pointer-events: none;
            user-select: none;
        }

        /* Title */
        .title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-primary);
            font-size: 2em;
            font-weight: 300;
            letter-spacing: 2px;
            z-index: 50;
            text-shadow: 0 2px 8px var(--ui-shadow);
            transition: color 0.3s ease;
        }
    </style>
</head>
<body data-theme="light">
    <div class="app-container">
        <h1 class="title" id="title">RADIAL CALENDAR 2026</h1>

        <!-- Zoom Level Slider -->
        <div class="zoom-slider">
            <div class="zoom-levels">
                <div class="zoom-level active" data-level="0">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Year</span>
                </div>
                <div class="zoom-level" data-level="1">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label" id="groupLabel">Quarter</span>
                </div>
                <div class="zoom-level" data-level="2">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Month</span>
                </div>
                <div class="zoom-level" data-level="3">
                    <div class="zoom-dot"></div>

                </div>
                <div class="zoom-level" data-level="4">
                    <div class="zoom-dot"></div>
                    <span class="zoom-label">Day</span>
                </div>
            </div>
        </div>

        <!-- Settings Trigger (Gear Icon) -->
        <div class="settings-trigger" id="settingsTrigger">
            <svg viewBox="0 0 24 24">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">Settings</div>

            <div class="settings-group">
                <span class="settings-label">Theme</span>
                <div class="toggle-container">
                    <button class="toggle-btn active" id="lightBtn">Light</button>
                    <button class="toggle-btn" id="darkBtn">Dark</button>
                </div>
            </div>

            <div class="settings-group">
                <span class="settings-label">View Mode</span>
                <div class="toggle-container">
                    <button class="toggle-btn active" id="quarterBtn">Quarter</button>
                    <button class="toggle-btn" id="trimesterBtn">Trimester</button>
                </div>
            </div>

            <div class="settings-group">
                <span class="settings-label">Week Start</span>
                <div class="toggle-container">
                    <button class="toggle-btn active" id="sundayBtn">Sunday</button>
                    <button class="toggle-btn" id="mondayBtn">Monday</button>
                </div>
            </div>

            <div class="settings-group">
                <span class="settings-label">Hour Range (Week View)</span>
                <div class="hour-range-container">
                    <div class="hour-range-track">
                        <div class="hour-range-selected" id="hourRangeSelected"></div>
                    </div>
                    <input type="range" min="0" max="24" value="6" class="hour-range-input" id="hourRangeMin" style="position: absolute; top: 20px;">
                    <input type="range" min="0" max="24" value="22" class="hour-range-input" id="hourRangeMax" style="position: absolute; top: 20px;">
                    <div class="hour-range-labels">
                        <span>0</span>
                        <span>6</span>

                    <div class="hour-range-values" id="hourRangeValues">6:00 - 22:00</div>
                </div>
            </div>
        </div>

        <!-- Calendar SVG -->
        <div class="calendar-container">
            <svg id="calendar" viewBox="0 0 1000 1000">
                <defs id="textPaths"></defs>
                <g id="zoomGroup">
                    <!-- Content will be dynamically generated -->
                </g>
            </svg>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const YEAR = 2026;
        const CENTER_X = 500;
        const CENTER_Y = 500;
        const OUTER_RADIUS = 400;
        const INNER_RADIUS_BASE = 280;
        const GAP_DEGREES = 4; // Increased for better visibility

        // Progressive ring thinning based on zoom level
        function getCurrentInnerRadius() {
            if (zoomLevel === 0) return 280; // Year: 120px thick
            if (zoomLevel === 1) return 300; // Quarter/Trimester: 100px thick
            if (zoomLevel === 2) return 320; // Month: 80px thick
            if (zoomLevel === 3) return 340; // Week: 60px thick
            return 340; // Day: 60px thick
        }

        // ===== STATE =====
        let theme = 'light';
        let viewMode = 'quarter';
        let weekStart = 'sunday';
        let hourRange = [6, 22]; // Default 6am to 10pm
        let zoomLevel = 0;
        let focusPath = [];
        let currentRotation = 0;

        // ===== DATA =====
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                          'July', 'August', 'September', 'October', 'November', 'December'];
        const monthAbbrev = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const monthDays = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        const quarters = {
            q1: { label: 'Q1', months: [0, 1, 2], startAngle: 0 },
            q2: { label: 'Q2', months: [3, 4, 5], startAngle: 90 },
            q3: { label: 'Q3', months: [6, 7, 8], startAngle: 180 },
            q4: { label: 'Q4', months: [9, 10, 11], startAngle: 270 }
        };

        const trimesters = {
            t1: { label: 'T1', months: [0, 1, 2, 3], startAngle: 0 },
            t2: { label: 'T2', months: [4, 5, 6, 7], startAngle: 120 },
            t3: { label: 'T3', months: [8, 9, 10, 11], startAngle: 240 }
        };

        const now = new Date();
        const TODAY_MONTH = now.getMonth();
        const TODAY_DAY = now.getDate();

        function getCurrentGroups() {
            return viewMode === 'quarter' ? quarters : trimesters;
        }

        function getGroupForMonth(monthIndex) {
            const groups = getCurrentGroups();
            for (const [key, group] of Object.entries(groups)) {
                if (group.months.includes(monthIndex)) {
                    return key;
                }
            }
            return null;
        }

        function getWeekNumber(date) {
            const jan1 = new Date(YEAR, 0, 1);
            const startDay = jan1.getDay();
            const weekStartOffset = weekStart === 'monday' ? (startDay === 0 ? 6 : startDay - 1) : startDay;

            const daysToFirstWeek = (7 - weekStartOffset) % 7;
            const firstWeekEnd = new Date(YEAR, 0, 1 + daysToFirstWeek);

            if (date < firstWeekEnd) return 1;

            const daysSince = Math.floor((date - firstWeekEnd) / (86400000));
            return Math.floor(daysSince / 7) + 2;
        }

        function getDaysInMonth(monthIndex) {
            const days = [];
            const numDays = monthDays[monthIndex];

            for (let day = 1; day <= numDays; day++) {
                const date = new Date(YEAR, monthIndex, day);
                const weekNum = getWeekNumber(date);
                const dayOfWeek = date.getDay();

                days.push({
                    day,
                    monthIndex,
                    weekNum,
                    dayOfWeek,
                    date
                });
            }

            return days;
        }

        function getWeeksForMonth(monthIndex) {
            const days = getDaysInMonth(monthIndex);
            const weeks = [...new Set(days.map(d => d.weekNum))];
            return weeks.sort((a, b) => a - b);
        }

        function getDaysInWeek(weekNum) {
            const days = [];
            for (let month = 0; month < 12; month++) {
                const monthDaysData = getDaysInMonth(month);
                const weekDays = monthDaysData.filter(d => d.weekNum === weekNum);
                days.push(...weekDays);
            }
            return days;
        }

        // ===== SVG HELPERS =====
        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        function describeArc(x, y, innerRadius, outerRadius, startAngle, endAngle) {
            const startOuter = polarToCartesian(x, y, outerRadius, startAngle);
            const endOuter = polarToCartesian(x, y, outerRadius, endAngle);
            const startInner = polarToCartesian(x, y, innerRadius, startAngle);
            const endInner = polarToCartesian(x, y, innerRadius, endAngle);

            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

            return [
                "M", startOuter.x, startOuter.y,
                "A", outerRadius, outerRadius, 0, largeArcFlag, 1, endOuter.x, endOuter.y,
                "L", endInner.x, endInner.y,
                "A", innerRadius, innerRadius, 0, largeArcFlag, 0, startInner.x, startInner.y,
                "Z"
            ].join(" ");
        }

        function describeTextArc(x, y, radius, startAngle, endAngle, reverse = false) {
            const start = polarToCartesian(x, y, radius, reverse ? endAngle : startAngle);
            const end = polarToCartesian(x, y, radius, reverse ? startAngle : endAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            const sweepFlag = reverse ? "0" : "1";

            return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} ${sweepFlag} ${end.x} ${end.y}`;
        }

        function getLabelPosition(centerX, centerY, radius, startAngle, endAngle) {
            const midAngle = (startAngle + endAngle) / 2;
            return polarToCartesian(centerX, centerY, radius, midAngle);
        }

        function shouldReverseText(startAngle, endAngle) {
            const midAngle = (startAngle + endAngle) / 2 + currentRotation;
            const normalizedAngle = ((midAngle % 360) + 360) % 360;
            return normalizedAngle > 90 && normalizedAngle < 270;
        }

        function drawRadialLine(angle, innerRadius, outerRadius) {
            const inner = polarToCartesian(CENTER_X, CENTER_Y, innerRadius, angle);
            const outer = polarToCartesian(CENTER_X, CENTER_Y, outerRadius, angle);
            return `M ${inner.x} ${inner.y} L ${outer.x} ${outer.y}`;
        }

        function drawArcLine(radius, startAngle, endAngle) {
            const start = polarToCartesian(CENTER_X, CENTER_Y, radius, startAngle);
            const end = polarToCartesian(CENTER_X, CENTER_Y, radius, endAngle);
            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
            return `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
        }

        // ===== RENDERING =====
        function renderCalendar() {
            const container = document.getElementById('zoomGroup');
            let html = '';

            if (zoomLevel === 0) {
                html += renderYearView();
            } else if (zoomLevel === 1) {
                html += renderGroupView();
            } else if (zoomLevel === 2) {
                html += renderMonthView();
            } else if (zoomLevel === 3) {
                html += renderWeekView();
            } else if (zoomLevel === 4) {
                html += renderDayView();
            }

            container.innerHTML = html;
            attachEventHandlers();
            applyZoomTransform();
        }

        function renderYearView() {
            let html = '';
            const groups = getCurrentGroups();
            const numGroups = Object.keys(groups).length;
            const degreesPerGroup = 360 / numGroups;
            const innerRadius = getCurrentInnerRadius();
            const midRadius = (OUTER_RADIUS + innerRadius) / 2;

            Object.values(groups).forEach((group, groupIdx) => {
                const groupStart = groupIdx * degreesPerGroup + GAP_DEGREES / 2;
                const groupEnd = (groupIdx + 1) * degreesPerGroup - GAP_DEGREES / 2;
                const groupAngle = groupEnd - groupStart;
                const degreesPerMonth = groupAngle / group.months.length;

                group.months.forEach((monthIndex, monthIdx) => {
                    const monthStart = groupStart + (monthIdx * degreesPerMonth);
                    const monthEnd = groupStart + ((monthIdx + 1) * degreesPerMonth);

                    const path = describeArc(CENTER_X, CENTER_Y, innerRadius, OUTER_RADIUS, monthStart, monthEnd);

                    const isCurrentMonth = monthIndex === TODAY_MONTH;
                    const currentClass = isCurrentMonth ? 'current-date' : '';

                    const textPathId = `text-path-${monthIndex}`;
                    const reverse = shouldReverseText(monthStart, monthEnd);
                    const textPath = describeTextArc(CENTER_X, CENTER_Y, midRadius, monthStart, monthEnd, reverse);

                    html += `<path class="segment ${currentClass}" data-type="month" data-index="${monthIndex}" d="${path}" />`;
                    html += `<defs><path id="${textPathId}" d="${textPath}" fill="none"/></defs>`;
                    html += `<text class="label"><textPath href="#${textPathId}" startOffset="50%" text-anchor="middle">${monthAbbrev[monthIndex]}</textPath></text>`;

                    // Add thin line between months (except at group boundaries)
                    if (monthIdx > 0) {
                        html += `<path class="thin-line" d="${drawRadialLine(monthStart, innerRadius, OUTER_RADIUS)}" />`;
                    }
                });
            });

            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="${innerRadius - 20}" fill="var(--bg-secondary)" stroke="var(--segment-border)" stroke-width="2"/>`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y + 15}" text-anchor="middle">${YEAR}</text>`;

            return html;
        }

        function renderGroupView() {
            let html = '';
            const groups = getCurrentGroups();
            const groupKey = Object.keys(groups)[focusPath[0]];
            const group = groups[groupKey];
            const innerRadius = getCurrentInnerRadius();
            const midRadius = (OUTER_RADIUS + innerRadius) / 2;

            const numMonths = group.months.length;
            const totalAngle = viewMode === 'quarter' ? 90 : 120;
            const startAngle = group.startAngle;

            // Context groups (faded)
            const numGroups = Object.keys(groups).length;
            const degreesPerGroup = 360 / numGroups;
            Object.values(groups).forEach((g, idx) => {
                const isInFocus = g.label === group.label;
                if (!isInFocus) {
                    const gStart = idx * degreesPerGroup + GAP_DEGREES / 2;
                    const gEnd = (idx + 1) * degreesPerGroup - GAP_DEGREES / 2;
                    const path = describeArc(CENTER_X, CENTER_Y, innerRadius, OUTER_RADIUS, gStart, gEnd);
                    html += `<path class="segment context" data-type="month-bg" d="${path}" />`;
                }
            });

            // Focused group with months, weeks, and week numbers
            const degreesPerMonth = (totalAngle - (GAP_DEGREES * numMonths)) / numMonths;
            group.months.forEach((monthIndex, idx) => {
                const monthStart = startAngle + (idx * (degreesPerMonth + GAP_DEGREES)) + GAP_DEGREES / 2;
                const monthEnd = monthStart + degreesPerMonth;
                const weeks = getWeeksForMonth(monthIndex);
                const degreesPerWeek = degreesPerMonth / weeks.length;

                // Draw month as single segment
                const monthPath = describeArc(CENTER_X, CENTER_Y, innerRadius, OUTER_RADIUS, monthStart, monthEnd);
                html += `<path class="segment" data-type="month" data-index="${monthIndex}" d="${monthPath}" />`;

                // Add thin lines between weeks AND week number labels
                weeks.forEach((weekNum, weekIdx) => {
                    const weekStart = monthStart + (weekIdx * degreesPerWeek);
                    const weekEnd = weekStart + degreesPerWeek;

                    if (weekIdx > 0) {
                        html += `<path class="thin-line" d="${drawRadialLine(weekStart, innerRadius, OUTER_RADIUS)}" />`;
                    }

                    // Add week number label
                    const labelPos = getLabelPosition(CENTER_X, CENTER_Y, midRadius, weekStart, weekEnd);
                    html += `<text class="week-label"><tspan x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle">${weekNum}</tspan></text>`;
                });

                const textPathId = `month-path-${monthIndex}`;
                const reverse = shouldReverseText(monthStart, monthEnd);
                const textPath = describeTextArc(CENTER_X, CENTER_Y, OUTER_RADIUS + 30, monthStart, monthEnd, reverse);

                html += `<defs><path id="${textPathId}" d="${textPath}" fill="none"/></defs>`;
                html += `<text class="month-name"><textPath href="#${textPathId}" startOffset="50%" text-anchor="middle">${monthNames[monthIndex]}</textPath></text>`;
            });

            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="${innerRadius - 20}" fill="var(--bg-secondary)" stroke="var(--segment-border)" stroke-width="2"/>`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y + 5}" text-anchor="middle">${group.label}</text>`;
            html += `<text class="label" style="font-size: 18px; fill: var(--text-secondary);" x="${CENTER_X}" y="${CENTER_Y + 30}" text-anchor="middle">${YEAR}</text>`;

            return html;
        }

        function renderMonthView() {
            let html = '';
            const monthIndex = focusPath[1];
            const days = getDaysInMonth(monthIndex);
            const weeks = getWeeksForMonth(monthIndex);
            const innerRadius = getCurrentInnerRadius();
            const midRadius = (OUTER_RADIUS + innerRadius) / 2;

            const totalDays = days.length;
            const numWeeks = weeks.length;
            const totalAngle = 360 - (GAP_DEGREES * numWeeks);

            // Group days by week
            const daysByWeek = {};
            days.forEach(day => {
                if (!daysByWeek[day.weekNum]) {
                    daysByWeek[day.weekNum] = [];
                }
                daysByWeek[day.weekNum].push(day);
            });

            let currentAngle = 0;
            weeks.forEach((weekNum, weekIdx) => {
                const weekDays = daysByWeek[weekNum];
                const daysInWeek = weekDays.length;
                const degreesForWeek = (daysInWeek / totalDays) * totalAngle;
                const degreesPerDay = degreesForWeek / daysInWeek;

                // Add gap before week (except first)
                if (weekIdx > 0) {
                    currentAngle += GAP_DEGREES;
                }

                const weekStart = currentAngle;
                const weekEnd = currentAngle + degreesForWeek;

                // Draw week as single segment
                const weekPath = describeArc(CENTER_X, CENTER_Y, innerRadius, OUTER_RADIUS, weekStart, weekEnd);
                html += `<path class="segment non-clickable" data-type="week-bg" data-week="${weekNum}" d="${weekPath}" />`;

                weekDays.forEach((dayData, dayIdx) => {
                    const dayStart = currentAngle;
                    const dayEnd = currentAngle + degreesPerDay;

                    const labelPos = getLabelPosition(CENTER_X, CENTER_Y, midRadius, dayStart, dayEnd);

                    const isCurrentDate = dayData.monthIndex === TODAY_MONTH && dayData.day === TODAY_DAY;
                    const currentClass = isCurrentDate ? 'current-date' : '';

                    html += `<text class="day-label ${currentClass}"><tspan x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle">${dayData.day}</tspan></text>`;

                    // Add thin line between days (except first day of week)
                    if (dayIdx > 0) {
                        html += `<path class="thin-line" d="${drawRadialLine(dayStart, innerRadius, OUTER_RADIUS)}" />`;
                    }

                    currentAngle += degreesPerDay;
                });
            });

            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="${innerRadius - 20}" fill="var(--bg-secondary)" stroke="var(--segment-border)" stroke-width="2"/>`;
            html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y + 5}" text-anchor="middle">${monthNames[monthIndex]}</text>`;
            html += `<text class="label" style="font-size: 18px; fill: var(--text-secondary);" x="${CENTER_X}" y="${CENTER_Y + 30}" text-anchor="middle">${YEAR}</text>`;

            return html;
        }

        function renderWeekView() {
            let html = '';
            const weekNum = focusPath[2];
            const weekDays = getDaysInWeek(weekNum);
            const innerRadius = getCurrentInnerRadius();
            const midRadius = (OUTER_RADIUS + innerRadius) / 2;

            if (weekDays.length === 0) {
                html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="100" fill="var(--bg-secondary)" />`;
                html += `<text class="center-label" x="${CENTER_X}" y="${CENTER_Y}" text-anchor="middle">Week ${weekNum}</text>`;
                return html;
            }

            // Show 7 days across 180° arc (left to right, top half of circle)
            // Starting at 180° (left) and ending at 0° (right)
            const totalArc = 180;
            const degreesPerDay = (totalArc - (GAP_DEGREES * 6)) / 7; // 6 gaps between 7 days
            const [hourMin, hourMax] = hourRange;
            const hourCount = hourMax - hourMin;
            const radiusRange = OUTER_RADIUS - innerRadius;
            const radiusPerHour = radiusRange / hourCount;

            // Render each day segment from left to right
            let currentAngle = 180; // Start at left (9 o'clock position)
            for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
                // Determine which day of week this is
                const targetDayOfWeek = weekStart === 'sunday' ? dayIdx : (dayIdx + 1) % 7;
                const actualDayData = weekDays.find(d => d.dayOfWeek === targetDayOfWeek) || null;

                const dayStart = currentAngle;
                const dayEnd = currentAngle + degreesPerDay;

                // Draw day segment background
                const dayPath = describeArc(CENTER_X, CENTER_Y, innerRadius, OUTER_RADIUS, dayStart, dayEnd);
                const isCurrentDay = actualDayData && actualDayData.monthIndex === TODAY_MONTH && actualDayData.day === TODAY_DAY;
                const currentClass = isCurrentDay ? 'current-date' : '';
                html += `<path class="segment non-clickable ${currentClass}" data-type="day-bg" data-day="${dayIdx}" d="${dayPath}" />`;

                // Add thin lines between hours (concentric arcs)
                for (let h = 1; h < hourCount; h++) {
                    const radius = innerRadius + (h * radiusPerHour);
                    html += `<path class="thin-line" d="${drawArcLine(radius, dayStart, dayEnd)}" />`;
                }

                // Day label
                const labelPos = getLabelPosition(CENTER_X, CENTER_Y, midRadius, dayStart, dayEnd);
                const dayLabel = actualDayData ? `${dayNames[actualDayData.dayOfWeek].substring(0, 3)} ${actualDayData.day}` : dayNames[targetDayOfWeek].substring(0, 3);
                html += `<text class="day-label" style="font-size: 11px;"><tspan x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle">${dayLabel}</tspan></text>`;

                currentAngle += degreesPerDay + GAP_DEGREES;
            }

            // Hour labels along the left edge
            for (let h = 0; h <= hourCount; h += 2) {
                const hour = hourMin + h;
                if (hour > hourMax) continue;
                const radius = innerRadius + (h * radiusPerHour);
                const labelPos = polarToCartesian(CENTER_X, CENTER_Y, radius, 180);
                html += `<text class="hour-label" style="font-size: 10px;"><tspan x="${labelPos.x - 25}" y="${labelPos.y}" text-anchor="end">${hour}:00</tspan></text>`;
            }

            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="${innerRadius - 20}" fill="var(--bg-secondary)" stroke="var(--segment-border)" stroke-width="2"/>`;
            html += `<text class="center-label" style="font-size: 36px;" x="${CENTER_X}" y="${CENTER_Y + 5}" text-anchor="middle">Week ${weekNum}</text>`;
            html += `<text class="label" style="font-size: 14px; fill: var(--text-secondary);" x="${CENTER_X}" y="${CENTER_Y + 25}" text-anchor="middle">${YEAR}</text>`;

            return html;
        }

        function renderDayView() {
            let html = '';
            const dayOfMonth = focusPath[3];
            const monthIndex = focusPath[1];
            const innerRadius = getCurrentInnerRadius();
            const midRadius = (OUTER_RADIUS + innerRadius) / 2;

            const degreesPerHour = 360 / 24;

            // Render 24 hour segments with gaps
            for (let hour = 0; hour < 24; hour++) {
                const hourStart = (hour * degreesPerHour) + GAP_DEGREES / 2;
                const hourEnd = ((hour + 1) * degreesPerHour) - GAP_DEGREES / 2;

                const path = describeArc(CENTER_X, CENTER_Y, innerRadius, OUTER_RADIUS, hourStart, hourEnd);
                const now = new Date();
                const isCurrentHour = monthIndex === TODAY_MONTH && dayOfMonth === TODAY_DAY && hour === now.getHours();
                const currentClass = isCurrentHour ? 'current-date' : '';

                html += `<path class="segment non-clickable ${currentClass}" data-type="hour" data-hour="${hour}" d="${path}" />`;

                // Hour label
                const labelPos = getLabelPosition(CENTER_X, CENTER_Y, midRadius, hourStart, hourEnd);
                const hourLabel = hour === 0 ? '12am' : hour < 12 ? `${hour}am` : hour === 12 ? '12pm' : `${hour - 12}pm`;
                html += `<text class="day-label"><tspan x="${labelPos.x}" y="${labelPos.y}" text-anchor="middle">${hourLabel}</tspan></text>`;
            }

            html += `<circle cx="${CENTER_X}" cy="${CENTER_Y}" r="${innerRadius - 20}" fill="var(--bg-secondary)" stroke="var(--segment-border)" stroke-width="2"/>`;
            html += `<text class="center-label" style="font-size: 32px;" x="${CENTER_X}" y="${CENTER_Y - 5}" text-anchor="middle">${monthNames[monthIndex]}</text>`;
            html += `<text class="center-label" style="font-size: 56px;" x="${CENTER_X}" y="${CENTER_Y + 40}" text-anchor="middle">${dayOfMonth}</text>`;

            return html;
        }

        function attachEventHandlers() {
            if (zoomLevel === 0) {
                document.querySelectorAll('[data-type="month"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const monthIndex = parseInt(e.target.dataset.index);
                        const groupKey = getGroupForMonth(monthIndex);
                        const groups = getCurrentGroups();
                        const groupIndex = Object.keys(groups).indexOf(groupKey);
                        zoomTo(1, [groupIndex]);
                    });
                });
            } else if (zoomLevel === 1) {
                document.querySelectorAll('[data-type="month"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const monthIndex = parseInt(e.target.dataset.index);
                        zoomTo(2, [focusPath[0], monthIndex]);
                    });
                });
            } else if (zoomLevel === 2) {
                document.querySelectorAll('[data-type="week-bg"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const weekNum = parseInt(e.target.dataset.week);
                        zoomTo(3, [focusPath[0], focusPath[1], weekNum]);
                    });
                });
            } else if (zoomLevel === 3) {
                document.querySelectorAll('[data-type="day-bg"]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const dayIdx = parseInt(e.target.dataset.day);
                        const weekDays = getDaysInWeek(focusPath[2]);
                        const targetDayOfWeek = (weekStart === 'sunday' ? dayIdx : (dayIdx + 1) % 7);
                        const dayData = weekDays.find(d => d.dayOfWeek === targetDayOfWeek);
                        if (dayData) {
                            zoomTo(4, [focusPath[0], dayData.monthIndex, focusPath[2], dayData.day]);
                        }
                    });
                });
            }
        }

        function normalizeAngle(angle) {
            while (angle > 180) angle -= 360;
            while (angle <= -180) angle += 360;
            return angle;
        }

        function applyZoomTransform() {
            const zoomGroup = document.getElementById('zoomGroup');
            const innerRadius = getCurrentInnerRadius();
            const midRadius = (OUTER_RADIUS + innerRadius) / 2;

            if (zoomLevel === 0) {
                currentRotation = 0;
                zoomGroup.style.transform = 'rotate(0deg) scale(1)';
            } else if (zoomLevel === 1) {
                const groups = getCurrentGroups();
                const groupKey = Object.keys(groups)[focusPath[0]];
                const group = groups[groupKey];

                const totalAngle = viewMode === 'quarter' ? 90 : 120;
                const midAngle = group.startAngle + (totalAngle / 2);

                const rotation = normalizeAngle(-midAngle);
                currentRotation = rotation;

                const scale = viewMode === 'quarter' ? 3.5 : 2.8;
                const panY = midRadius * scale;

                zoomGroup.style.transform = `translate(0, ${panY}px) rotate(${rotation}deg) scale(${scale})`;
            } else if (zoomLevel === 2) {
                const groups = getCurrentGroups();
                const groupKey = Object.keys(groups)[focusPath[0]];
                const group = groups[groupKey];
                const monthIndex = focusPath[1];

                const numMonths = group.months.length;
                const totalAngle = viewMode === 'quarter' ? 90 : 120;
                const degreesPerMonth = totalAngle / numMonths;
                const monthIndexInGroup = group.months.indexOf(monthIndex);
                const monthStartAngle = group.startAngle + (monthIndexInGroup * degreesPerMonth);
                const monthMidAngle = monthStartAngle + (degreesPerMonth / 2);

                const rotation = normalizeAngle(-monthMidAngle);
                currentRotation = rotation;

                const scale = 5;
                const panY = midRadius * scale;

                zoomGroup.style.transform = `translate(0, ${panY}px) rotate(${rotation}deg) scale(${scale})`;
            } else if (zoomLevel === 3) {
                currentRotation = 0;
                const scale = 2.5;
                const panY = midRadius * scale;
                zoomGroup.style.transform = `translate(0, ${panY}px) rotate(0deg) scale(${scale})`;
            } else if (zoomLevel === 4) {
                currentRotation = 0;
                const scale = 2.5;
                const panY = midRadius * scale;
                zoomGroup.style.transform = `translate(0, ${panY}px) rotate(0deg) scale(${scale})`;
            }
        }

        function zoomTo(level, path) {
            console.log(`Zooming to level ${level}, path:`, path);
            zoomLevel = level;
            focusPath = path;
            updateUI();
            renderCalendar();
        }

        function updateUI() {
            document.querySelectorAll('.zoom-level').forEach(el => {
                el.classList.toggle('active', parseInt(el.dataset.level) === zoomLevel);
            });

            if (zoomLevel === 0) {
                document.getElementById('title').textContent = 'RADIAL CALENDAR 2026';
            } else if (zoomLevel === 1) {
                const groups = getCurrentGroups();
                const groupKey = Object.keys(groups)[focusPath[0]];
                document.getElementById('title').textContent = `${groups[groupKey].label} 2026`;
            } else if (zoomLevel === 2) {
                const monthIndex = focusPath[1];
                document.getElementById('title').textContent = `${monthNames[monthIndex]} 2026`;
            } else if (zoomLevel === 3) {
                const weekNum = focusPath[2];
                document.getElementById('title').textContent = `Week ${weekNum} - 2026`;
            } else if (zoomLevel === 4) {
                const monthIndex = focusPath[1];
                const dayOfMonth = focusPath[3];
                document.getElementById('title').textContent = `${monthNames[monthIndex]} ${dayOfMonth}, 2026`;
            }
        }

        function switchTheme(newTheme) {
            theme = newTheme;
            document.body.setAttribute('data-theme', theme);
            document.getElementById('lightBtn').classList.toggle('active', theme === 'light');
            document.getElementById('darkBtn').classList.toggle('active', theme === 'dark');
        }

        function switchMode(mode) {
            if (viewMode === mode) return;
            viewMode = mode;

            document.getElementById('quarterBtn').classList.toggle('active', mode === 'quarter');
            document.getElementById('trimesterBtn').classList.toggle('active', mode === 'trimester');
            document.getElementById('groupLabel').textContent = mode === 'quarter' ? 'Quarter' : 'Trimester';

            zoomTo(0, []);
        }

        function switchWeekStart(start) {
            if (weekStart === start) return;
            weekStart = start;

            document.getElementById('sundayBtn').classList.toggle('active', start === 'sunday');
            document.getElementById('mondayBtn').classList.toggle('active', start === 'monday');

            renderCalendar();
        }

        function updateHourRange() {
            const min = parseInt(document.getElementById('hourRangeMin').value);
            const max = parseInt(document.getElementById('hourRangeMax').value);

            // Ensure min is always less than max
            if (min >= max) {
                if (event.target.id === 'hourRangeMin') {
                    document.getElementById('hourRangeMin').value = max - 1;
                } else {
                    document.getElementById('hourRangeMax').value = min + 1;
                }
                return;
            }

            hourRange = [min, max];

            // Update visual indicator
            const percent1 = (min / 24) * 100;
            const percent2 = (max / 24) * 100;
            const selected = document.getElementById('hourRangeSelected');
            selected.style.left = percent1 + '%';
            selected.style.width = (percent2 - percent1) + '%';

            // Update values display
            document.getElementById('hourRangeValues').textContent = `${min}:00 - ${max}:00`;

            // Re-render if in week view
            if (zoomLevel === 3) {
                renderCalendar();
            }
        }

        function getCurrentDateSegments() {
            const now = new Date();
            const month = now.getMonth();
            const dayOfMonth = now.getDate();

            const groupKey = getGroupForMonth(month);
            const groups = getCurrentGroups();
            const groupIndex = Object.keys(groups).indexOf(groupKey);

            const date = new Date(YEAR, month, dayOfMonth);
            const weekNum = getWeekNumber(date);

            return {
                groupIndex,
                month,
                weekNum,
                dayOfMonth
            };
        }

        // Event listeners
        document.getElementById('settingsTrigger').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.toggle('open');
        });

        document.getElementById('lightBtn').addEventListener('click', () => switchTheme('light'));
        document.getElementById('darkBtn').addEventListener('click', () => switchTheme('dark'));
        document.getElementById('quarterBtn').addEventListener('click', () => switchMode('quarter'));
        document.getElementById('trimesterBtn').addEventListener('click', () => switchMode('trimester'));
        document.getElementById('sundayBtn').addEventListener('click', () => switchWeekStart('sunday'));
        document.getElementById('mondayBtn').addEventListener('click', () => switchWeekStart('monday'));

        document.getElementById('hourRangeMin').addEventListener('input', updateHourRange);
        document.getElementById('hourRangeMax').addEventListener('input', updateHourRange);

        document.querySelectorAll('.zoom-level').forEach(el => {
            el.addEventListener('click', () => {
                const targetLevel = parseInt(el.dataset.level);

                if (targetLevel < zoomLevel) {
                    zoomTo(targetLevel, focusPath.slice(0, targetLevel));
                } else if (targetLevel > zoomLevel) {
                    const current = getCurrentDateSegments();

                    if (targetLevel === 1) {
                        zoomTo(1, [current.groupIndex]);
                    } else if (targetLevel === 2) {
                        zoomTo(2, [current.groupIndex, current.month]);
                    } else if (targetLevel === 3) {
                        zoomTo(3, [current.groupIndex, current.month, current.weekNum]);
                    } else if (targetLevel === 4) {
                        zoomTo(4, [current.groupIndex, current.month, current.weekNum, current.dayOfMonth]);
                    }
                }
            });
        });

        // Initialize hour range slider
        updateHourRange();

        // Initialize
        renderCalendar();
        console.log('Radial Calendar 2026 initialized');
    </script>
</body>
</html>
